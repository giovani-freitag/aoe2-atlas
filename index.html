<!doctype html>
<!--
    The shell is English, the language the interface falls back to. The bundle stamps the
    language the reader actually wants onto this element as soon as it has detected it.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0f1216" />
        <meta name="color-scheme" content="dark light" />
        <meta
            name="description"
            content="Interactive map of Age of Empires II: where each civilization's Wonder really stands, and the reconstructed extent of its realm, century by century — drawn in equal area, with the source's own confidence in every border shown. In the seventeen languages the game is sold in."
        />
        <link rel="icon" type="image/svg+xml" href="./brand.svg" />
        <title>AoE2 Atlas — Wonders and territories of Age of Empires II</title>
    </head>
    <body>
        <!--
            The mark stands in until the bundle mounts and replaces it.

            Its styles are inline because the stylesheet arrives with the bundle it is waiting for,
            and a reader looking at a blank page for two seconds decides the atlas is broken.
        -->
        <div id="root">
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    gap: 1rem;
                    align-items: center;
                    justify-content: center;
                    min-height: 100dvh;
                    background: #0f1216;
                    color: #e6bb6b;
                    font-family: system-ui, sans-serif;
                    letter-spacing: 0.14em;
                    text-transform: uppercase;
                    font-size: 0.75rem;
                "
            >
                <img src="./brand.svg" alt="" width="56" height="56" style="opacity: 0.9" />
                <span>AoE2 Atlas</span>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
