<!doctype html>
<!--
    The shell is English, the language the interface falls back to. The bundle stamps the
    language the reader actually wants onto this element as soon as it has detected it.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0f1216" />
        <meta name="color-scheme" content="dark light" />
        <meta
            name="description"
            content="Interactive map of Age of Empires II: where each civilization's Wonder really stands, and the reconstructed extent of its realm, century by century. In seventeen languages."
        />
        <link rel="icon" type="image/svg+xml" href="./brand.svg" />
        <title>AoE2 Atlas — Wonders and territories of Age of Empires II</title>

        <!--
            What a pasted link becomes on Discord, WhatsApp and the rest. Absolute, because a
            crawler resolves nothing: a relative image is a card with a hole where the picture
            goes. The address is the published one whatever this was built on, since it is only
            ever read from there.
        -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="AoE2 Atlas" />
        <meta property="og:title" content="AoE2 Atlas — Wonders and territories of Age of Empires II" />
        <meta
            property="og:description"
            content="Interactive map of Age of Empires II: where each civilization's Wonder really stands, and the reconstructed extent of its realm, century by century. In seventeen languages."
        />
        <meta property="og:url" content="https://giovani-freitag.github.io/aoe2-atlas/" />
        <meta property="og:image" content="https://giovani-freitag.github.io/aoe2-atlas/social-card.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="A world map on parchment with the arms of 35 Age of Empires II civilizations standing on their territories in the year 1200."
        />
        <meta property="og:locale" content="en_US" />

        <!-- The wide card rather than the thumbnail: the map is the point, and a world shrunk to a
             thumbnail is a beige square. -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="AoE2 Atlas — Wonders and territories of Age of Empires II" />
        <meta
            name="twitter:description"
            content="Interactive map of Age of Empires II: where each civilization's Wonder really stands, and the reconstructed extent of its realm, century by century. In seventeen languages."
        />
        <meta name="twitter:image" content="https://giovani-freitag.github.io/aoe2-atlas/social-card.png" />
        <meta
            name="twitter:image:alt"
            content="A world map on parchment with the arms of 35 Age of Empires II civilizations standing on their territories in the year 1200."
        />
    </head>
    <body>
        <!--
            The mark stands in until the bundle mounts and replaces it.

            Its styles are inline because the stylesheet arrives with the bundle it is waiting for,
            and a reader looking at a blank page for two seconds decides the atlas is broken.
        -->
        <div id="root">
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    gap: 1rem;
                    align-items: center;
                    justify-content: center;
                    min-height: 100dvh;
                    background: #0f1216;
                    color: #e6bb6b;
                    font-family: system-ui, sans-serif;
                    letter-spacing: 0.14em;
                    text-transform: uppercase;
                    font-size: 0.75rem;
                "
            >
                <img src="./brand.svg" alt="" width="56" height="56" style="opacity: 0.9" />
                <span>AoE2 Atlas</span>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
